name: CI - GenerativePCR Matrix Lint and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip 
        pip install ".[dev]"

    - name: Check formatting with Black
      run: |
        python -m black --version
        python -m black --check --diff --color gpcr tests

    # Optional: keep flake8 for a short transition; safe to remove once Ruff is in place
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 gpcr tests --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run tests
      run: |
        PYTHONPATH=. pytest tests/ --maxfail=1 --disable-warnings -q

