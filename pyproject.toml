[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpcr"
version = "0.1.0"
description = "Generative Principal Component Regression"
authors = [
    { name="Austin Talbot", email="atalbot@bystro.io" }
]
readme = "README.md"
license = "MIT" 
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "tqdm",
    "torch",
    "matplotlib",
    "pytest",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.9",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "black==23.12.1",
]

[project.urls]
Homepage = "https://github.com/Bystro/GenerativePCR"

[tool.ruff]
line-length = 80
# Keep this at your support floor; raise only if you use newer syntax.
target-version = "py312"
extend-exclude = ["*.ipynb","build", "dist", ".venv", ".eggs"]

[tool.ruff.lint]
# Lint + import sorting only.
select = ["E", "F", "I"]
# Avoid conflicts with Black (long lines, trailing commas, string concat).
ignore = ["E501", "COM812", "ISC001"]

[tool.ruff.lint.isort]
known-first-party = ["genomix"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 80
target-version = ["py312"]
extend-exclude = "\\.ipynb$"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpcr*"]
exclude = ["paper*", "tests*", "docs*"]
